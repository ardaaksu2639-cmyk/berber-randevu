<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Online Randevu</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f3f3;
    color:#181818;
}

.wrap{
    max-width:650px;
    margin:auto;
    padding:24px 16px 50px;
}

.hero{
    text-align:center;
    padding:20px;
}

.hero h1{
    margin:8px 0;
}

.hero p{
    color:#666;
    margin:0;
}

.card{
    background:white;
    border-radius:20px;
    padding:22px;
    box-shadow:0 8px 25px #0002;
}

label{
    display:block;
    font-weight:bold;
    margin:16px 0 7px;
}

select,
input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:12px;
    font-size:16px;
    background:white;
}

.times{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.time{
    padding:12px 5px;
    border:1px solid #ccc;
    border-radius:10px;
    background:white;
    cursor:pointer;
    font-size:15px;
}

.time.active{
    background:#181818;
    color:white;
}

.time:disabled{
    background:#eee;
    color:#999;
    cursor:not-allowed;
}

.submit{
    width:100%;
    padding:16px;
    margin-top:22px;
    border:0;
    border-radius:14px;
    background:#181818;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.submit:hover{
    opacity:.9;
}

#result{
    display:none;
    margin-top:22px;
    padding:22px;
    border-radius:16px;
    background:#eef9f0;
    border:1px solid #b9dfc0;
}

.onay-baslik{
    text-align:center;
    font-size:21px;
    font-weight:bold;
    margin-bottom:18px;
}

.onay-satir{
    padding:8px 0;
    border-bottom:1px solid #d8eadb;
}

.onay-satir:last-child{
    border-bottom:0;
}

.onay-etiket{
    font-size:13px;
    color:#666;
    margin-bottom:3px;
}

.onay-deger{
    font-weight:bold;
}

.note{
    text-align:center;
    font-size:12px;
    opacity:.6;
    margin-top:16px;
}

@media(max-width:450px){

    .wrap{
        padding:15px 12px 35px;
    }

    .card{
        padding:18px;
    }

    .time{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="wrap">

<div class="hero">
    <div style="font-size:48px">💈</div>
    <h1 id="dukkanAdi">Yükleniyor...</h1>
    <p id="altBaslik">Online Randevu</p>
</div>

<div class="card">

<label>Hizmet</label>
<select id="service"></select>

<label>Berber</label>
<select id="barber"></select>

<label>Tarih</label>
<input id="date" type="date">

<label>Saat</label>
<div class="times" id="saatler"></div>

<label>Ad Soyad</label>
<input id="name" placeholder="Adınızı ve soyadınızı yazın">

<label>Telefon</label>
<input id="phone" type="tel" placeholder="05xx xxx xx xx">

<button class="submit" type="button" onclick="book()">
    Randevu Oluştur
</button>

<div id="result"></div>

<div class="note">
    Randevunuz sisteme kaydedilir.
</div>

</div>
</div>

<script>

let secilenSaat = "";


function bugununTarihi(){

    const simdi = new Date();

    const yil = simdi.getFullYear();
    const ay = String(simdi.getMonth() + 1).padStart(2, "0");
    const gun = String(simdi.getDate()).padStart(2, "0");

    return `${yil}-${ay}-${gun}`;
}


document.getElementById("date").min = bugununTarihi();


async function ayarlariYukle(){

    try{

        const cevap = await fetch("/api/ayarlar");
        const ayarlar = await cevap.json();

        if(!cevap.ok){
            throw new Error("Ayarlar yüklenemedi");
        }


        document.getElementById("dukkanAdi").textContent =
            ayarlar.dukkan_adi;

        document.getElementById("altBaslik").textContent =
            ayarlar.alt_baslik;

        document.title =
            ayarlar.dukkan_adi + " - Randevu";


        const hizmetSec =
            document.getElementById("service");

        hizmetSec.innerHTML = "";

        ayarlar.hizmetler.forEach(hizmet => {

            const secenek =
                document.createElement("option");

            secenek.value =
                `${hizmet.ad} — ${hizmet.fiyat} ₺`;

            secenek.textContent =
                `${hizmet.ad} — ${hizmet.fiyat} ₺`;

            hizmetSec.appendChild(secenek);

        });


        const berberSec =
            document.getElementById("barber");

        berberSec.innerHTML = "";

        ayarlar.berberler.forEach(berber => {

            const secenek =
                document.createElement("option");

            secenek.value = berber;
            secenek.textContent = berber;

            berberSec.appendChild(secenek);

        });


        const saatKutusu =
            document.getElementById("saatler");

        saatKutusu.innerHTML = "";

        ayarlar.saatler.forEach(saat => {

            const buton =
                document.createElement("button");

            buton.type = "button";
            buton.className = "time";
            buton.dataset.saat = saat;
            buton.textContent = saat;

            buton.addEventListener("click", function(){

                if(buton.disabled){
                    return;
                }

                document.querySelectorAll(".time").forEach(x => {
                    x.classList.remove("active");
                });

                buton.classList.add("active");

                secilenSaat = buton.dataset.saat;
            });

            saatKutusu.appendChild(buton);

        });


    }catch(hata){

        console.error(hata);

        alert(
            "Dükkan ayarları yüklenemedi."
        );

    }
}


async function doluSaatleriGetir(){

    const berber =
        document.getElementById("barber").value;

    const tarih =
        document.getElementById("date").value;

    secilenSaat = "";

    document.querySelectorAll(".time").forEach(btn => {

        btn.disabled = false;
        btn.classList.remove("active");
        btn.textContent = btn.dataset.saat;

    });

    if(!berber || !tarih){
        return;
    }

    try{

        const cevap = await fetch(
            "/api/dolu-saatler?berber=" +
            encodeURIComponent(berber) +
            "&tarih=" +
            encodeURIComponent(tarih)
        );

        const doluSaatler =
            await cevap.json();

        document.querySelectorAll(".time").forEach(btn => {

            if(
                doluSaatler.includes(
                    btn.dataset.saat
                )
            ){
                btn.disabled = true;

                btn.textContent =
                    btn.dataset.saat + " - DOLU";
            }

        });

    }catch(hata){

        console.error(
            "Dolu saatler alınamadı:",
            hata
        );

    }
}


document
.getElementById("barber")
.addEventListener(
    "change",
    doluSaatleriGetir
);


document
.getElementById("date")
.addEventListener(
    "change",
    doluSaatleriGetir
);


async function book(){

    const ad =
        document.getElementById("name")
        .value.trim();

    const telefon =
        document.getElementById("phone")
        .value.trim();

    const berber =
        document.getElementById("barber")
        .value;

    const hizmet =
        document.getElementById("service")
        .value;

    const tarih =
        document.getElementById("date")
        .value;


    if(
        !ad ||
        !telefon ||
        !berber ||
        !hizmet ||
        !tarih ||
        !secilenSaat
    ){
        alert(
            "Lütfen tüm bilgileri doldurun."
        );

        return;
    }


    const randevuSaati =
        secilenSaat;


    try{

        const cevap = await fetch(
            "/api/randevu",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    ad:ad,
                    telefon:telefon,
                    berber:berber,
                    hizmet:hizmet,
                    tarih:tarih,
                    saat:randevuSaati
                })
            }
        );


        const veri =
            await cevap.json();


        if(!cevap.ok){

            alert(
                veri.hata ||
                "Randevu kaydedilemedi."
            );

            await doluSaatleriGetir();

            return;
        }


        const sonuc =
            document.getElementById("result");


        sonuc.style.display = "block";


        sonuc.innerHTML = `
            <div class="onay-baslik">
                ✅ Randevunuz Oluşturuldu
            </div>

            <div class="onay-satir">
                <div class="onay-etiket">
                    Ad Soyad
                </div>
                <div class="onay-deger">
                    ${ad}
                </div>
            </div>

            <div class="onay-satir">
                <div class="onay-etiket">
                    Hizmet
                </div>
                <div class="onay-deger">
                    ${hizmet}
                </div>
            </div>

            <div class="onay-satir">
                <div class="onay-etiket">
                    Berber
                </div>
                <div class="onay-deger">
                    ${berber}
                </div>
            </div>

            <div class="onay-satir">
                <div class="onay-etiket">
                    Tarih ve Saat
                </div>
                <div class="onay-deger">
                    ${tarih} — ${randevuSaati}
                </div>
            </div>
        `;


        sonuc.scrollIntoView({
            behavior:"smooth"
        });


        document.getElementById("name").value = "";
        document.getElementById("phone").value = "";


        await doluSaatleriGetir();


    }catch(hata){

        console.error(hata);

        alert(
            "Sunucuya bağlanılamadı."
        );

    }
}


ayarlariYukle();

</script>

</body>
</html>
