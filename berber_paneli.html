<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berber Yönetim Paneli</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f3f3;
    color:#181818;
}

.wrap{
    max-width:1100px;
    margin:50px auto;
    padding:20px;
}

.ust{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
}

.ust h1{
    margin:0 0 8px 0;
}

.ust p{
    margin:0;
    color:#666;
}

.cikis{
    background:#181818;
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:10px;
    font-weight:bold;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 8px 25px #0002;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:14px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#181818;
    color:white;
}

.sil{
    background:#d93025;
    color:white;
    border:0;
    border-radius:8px;
    padding:8px 13px;
    cursor:pointer;
}

.sil:hover{
    opacity:.8;
}

@media(max-width:600px){
    .ust{
        align-items:flex-start;
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="wrap">

<div class="ust">

    <div>
        <h1>💈 Berber Yönetim Paneli</h1>
        <p>Randevu Yönetimi</p>
    </div>

    <a class="cikis" href="/cikis">
        Çıkış Yap
    </a>

</div>

<div class="card">

<h2>Randevular</h2>

<table>

<thead>
<tr>
    <th>Ad Soyad</th>
    <th>Telefon</th>
    <th>Berber</th>
    <th>Hizmet</th>
    <th>Tarih</th>
    <th>Saat</th>
    <th>İşlem</th>
</tr>
</thead>

<tbody id="randevuListesi"></tbody>

</table>

</div>
</div>

<script>

async function randevulariGetir(){

    const cevap = await fetch("/api/randevular");

    if(cevap.status === 401){
        window.location.href = "/giris";
        return;
    }

    const data = await cevap.json();

    const liste = document.getElementById("randevuListesi");

    liste.innerHTML = "";

    data.forEach(r => {

        liste.innerHTML += `
        <tr>
            <td>${r.ad}</td>
            <td>${r.telefon}</td>
            <td>${r.berber || "-"}</td>
            <td>${r.hizmet || "-"}</td>
            <td>${r.tarih}</td>
            <td>${r.saat}</td>
            <td>
                <button class="sil" onclick="randevuSil(${r.id})">
                    Sil
                </button>
            </td>
        </tr>
        `;

    });
}


async function randevuSil(id){

    const eminMi = confirm(
        "Bu randevuyu silmek istediğinize emin misiniz?"
    );

    if(!eminMi){
        return;
    }

    const cevap = await fetch("/api/randevu/" + id, {
        method:"DELETE"
    });

    if(cevap.status === 401){
        window.location.href = "/giris";
        return;
    }

    const veri = await cevap.json();

    if(!cevap.ok){
        alert(veri.hata || "Randevu silinemedi.");
        return;
    }

    alert("Randevu silindi.");

    randevulariGetir();
}


randevulariGetir();

</script>

</body>
</html>
