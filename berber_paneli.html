<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yönetim Paneli</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f3f3;
    color:#181818;
}

.wrap{
    max-width:1100px;
    margin:40px auto;
    padding:16px;
}

.ust{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
}

.ust-sol h1{
    margin:0 0 6px 0;
    font-size:28px;
}

.ust-sol p{
    margin:0;
    color:#666;
}

.cikis{
    background:#181818;
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:10px;
    font-weight:bold;
    white-space:nowrap;
}

.card{
    background:white;
    border-radius:20px;
    padding:22px;
    box-shadow:0 8px 25px #0002;
}

.card h2{
    margin-top:0;
}

.tablo-kutu{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th,
td{
    padding:14px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#181818;
    color:white;
}

.sil{
    background:#d93025;
    color:white;
    border:0;
    border-radius:8px;
    padding:8px 13px;
    cursor:pointer;
}

.sil:hover{
    opacity:.85;
}

.bos{
    text-align:center;
    color:#777;
    padding:30px;
}

@media(max-width:600px){

    .wrap{
        margin:15px auto;
        padding:10px;
    }

    .ust{
        flex-direction:column;
        align-items:stretch;
    }

    .ust-sol h1{
        font-size:23px;
    }

    .cikis{
        text-align:center;
        width:100%;
    }

    .card{
        padding:15px;
        border-radius:15px;
    }
}
</style>
</head>

<body>

<div class="wrap">

<div class="ust">

    <div class="ust-sol">
        <h1 id="panelBaslik">💈 Yönetim Paneli</h1>
        <p>Randevu Yönetimi</p>
    </div>

    <a class="cikis" href="/cikis">
        Çıkış Yap
    </a>

</div>

<div class="card">

<h2>Randevular</h2>

<div class="tablo-kutu">

<table>

<thead>
<tr>
    <th>Ad Soyad</th>
    <th>Telefon</th>
    <th>Berber</th>
    <th>Hizmet</th>
    <th>Tarih</th>
    <th>Saat</th>
    <th>İşlem</th>
</tr>
</thead>

<tbody id="randevuListesi"></tbody>

</table>

</div>

</div>
</div>

<script>

async function dukkanAdiniGetir(){

    try{

        const cevap = await fetch("/api/ayarlar");
        const ayarlar = await cevap.json();

        if(cevap.ok){

            document.getElementById("panelBaslik").textContent =
                "💈 " + ayarlar.dukkan_adi + " Yönetim Paneli";

            document.title =
                ayarlar.dukkan_adi + " - Yönetim Paneli";
        }

    }catch(hata){

        console.error(
            "Dükkan adı alınamadı:",
            hata
        );

    }
}


async function randevulariGetir(){

    const cevap = await fetch("/api/randevular");

    if(cevap.status === 401){

        window.location.href = "/giris";
        return;

    }

    const data = await cevap.json();

    const liste =
        document.getElementById("randevuListesi");

    liste.innerHTML = "";

    if(data.length === 0){

        liste.innerHTML = `
        <tr>
            <td colspan="7" class="bos">
                Henüz randevu bulunmuyor.
            </td>
        </tr>
        `;

        return;
    }

    data.forEach(r => {

        liste.innerHTML += `
        <tr>
            <td>${r.ad}</td>
            <td>${r.telefon}</td>
            <td>${r.berber || "-"}</td>
            <td>${r.hizmet || "-"}</td>
            <td>${r.tarih}</td>
            <td>${r.saat}</td>
            <td>
                <button
                    class="sil"
                    onclick="randevuSil(${r.id})"
                >
                    Sil
                </button>
            </td>
        </tr>
        `;

    });
}


async function randevuSil(id){

    const eminMi = confirm(
        "Bu randevuyu silmek istediğinize emin misiniz?"
    );

    if(!eminMi){
        return;
    }

    const cevap = await fetch(
        "/api/randevu/" + id,
        {
            method:"DELETE"
        }
    );

    if(cevap.status === 401){

        window.location.href = "/giris";
        return;

    }

    const veri = await cevap.json();

    if(!cevap.ok){

        alert(
            veri.hata ||
            "Randevu silinemedi."
        );

        return;
    }

    alert("Randevu silindi.");

    randevulariGetir();
}


dukkanAdiniGetir();
randevulariGetir();

</script>

</body>
</html>
